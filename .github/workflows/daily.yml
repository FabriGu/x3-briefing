name: daily briefing
on:
  schedule:
    - cron: "30 10 * * *"   # ~6:30 am New York (EDT); 5:30 am in winter
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest test_briefing -v
      - run: pip install anthropic
      - run: python briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: commit briefing.json
        run: |
          git config user.name "x3-briefing bot"
          git config user.email "actions@users.noreply.github.com"
          git add briefing.json
          git diff --cached --quiet || git commit -m "briefing: $(date -u +%F)"
          git push
